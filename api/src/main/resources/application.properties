spring.application.name=ehr

# Runtime connections use the least-privilege user; Flyway migrates as the schema owner.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/ehr
spring.datasource.username=ehr_app
spring.datasource.password=${EHR_APP_PASSWORD:ehr_app}
spring.flyway.user=ehr_owner
spring.flyway.password=${EHR_OWNER_PASSWORD:ehr_owner}

# Tokens come from the Keycloak ehr realm. Signing keys are fetched from KEYCLOAK_URL, which may
# differ from the public issuer when the API runs in a container.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/ehr
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://localhost:8081}/realms/ehr/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=ehr-api
# Realm roles become Spring authorities, e.g. PHYSICIAN -> ROLE_PHYSICIAN.
spring.security.oauth2.resourceserver.jwt.authorities-claim-expressions=[realm_access][roles]
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

spring.jpa.open-in-view=false

# Error responses use RFC 9457 problem details, so a 400 or 409 carries its reason. Reasons
# never include PHI.
spring.mvc.problemdetails.enabled=true
