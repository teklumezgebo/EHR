# Local development services. Credentials below are dev-only defaults; override via a root .env file.
name: ehr

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ehr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EHR_OWNER_PASSWORD: ${EHR_OWNER_PASSWORD:-ehr_owner}
      EHR_APP_PASSWORD: ${EHR_APP_PASSWORD:-ehr_app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only on an empty volume; use `docker compose down -v` to re-run them.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ehr"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # The realm is imported only if it does not exist yet; run `docker compose down` to reload infra/keycloak changes.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Fixed public URL keeps the token issuer stable; backchannel calls (JWKS, token) may use any host.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships without curl, so the readiness probe uses bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

volumes:
  pgdata:
