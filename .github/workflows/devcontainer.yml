name: Dev container image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/build/**"
      - ".github/workflows/devcontainer.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ehr-devcontainer

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/build/devcontainer.json
          imageName: ${{ env.IMAGE }}
          # Pushes latest-linux-amd64 or latest-linux-arm64 for the merge job.
          imageTag: latest
          platform: ${{ matrix.platform }}
          useNativeRunner: true
          push: always
          runCmd: |
            java -version
            node --version && npm --version
            docker --version && docker compose version && docker buildx version
            terraform version
            gh --version
            psql --version

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci/merge@v0.3
        with:
          imageName: ${{ env.IMAGE }}
          imageTag: latest
          platforms: linux/amd64,linux/arm64
